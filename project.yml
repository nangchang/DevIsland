name: DevIsland
options:
  bundleIdPrefix: kr.or.nes
  xcodeVersion: "15.0"
  objectVersion: 56
  developmentLanguage: en
  knownRegions:
    - en
    - ko
settings:
  SWIFT_VERSION: "5.9"
  SWIFT_STRICT_CONCURRENCY: targeted
packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: "0.3.1"
targets:
  DevIsland:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: DevIsland
      - path: scripts/devisland-bridge.sh
        group: Resources
        type: resource
      - path: scripts/devisland_bridge.py
        group: Resources
        type: resource
      - path: scripts/codex-devisland-auto.sh
        group: Resources
        type: resource
      - path: scripts/hook_events.json
        group: Resources
        type: resource
      - path: scripts/install-bridge.sh
        group: Resources
        type: resource
      - path: scripts/install_hooks.py
        group: Resources
        type: resource
      - path: scripts/install-launch-agent.sh
        group: Resources
        type: resource
    info:
      path: DevIsland/Info.plist
      properties:
        CFBundleShortVersionString: "0.13.1-dev"
        CFBundleVersion: "86"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: "Approve/Deny 후 터미널 앱을 포커스하기 위해 사용합니다."
        NSAccessibilityUsageDescription: "글로벌 단축키(⌘⇧Y/N) 사용을 위해 접근성 권한이 필요합니다."
        NSLocationUsageDescription: "Caffeine 기능에서 특정 Wi-Fi(SSID) 예외 처리를 위해 현재 연결된 네트워크 이름을 확인합니다."
        NSLocationWhenInUseUsageDescription: "Caffeine 기능에서 특정 Wi-Fi(SSID) 예외 처리를 위해 현재 연결된 네트워크 이름을 확인합니다."
    dependencies:
      - package: Textual
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: kr.or.nes.DevIsland
        PRODUCT_MODULE_NAME: DevIsland
        PRODUCT_NAME: "$(TARGET_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: kr.or.nes.DevIsland.dev
          PRODUCT_NAME: "DevIsland Dev"
  DevIslandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: DevIslandTests
    dependencies:
      - target: DevIsland
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          BUNDLE_LOADER: "$(TEST_HOST)"
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DevIsland Dev.app/Contents/MacOS/DevIsland Dev"
schemes:
  DevIsland:
    build:
      targets:
        DevIsland: all
    test:
      targets:
        - name: DevIslandTests
      environmentVariables:
        XCODE_RUNNING_UNIT_TESTS: "1"
