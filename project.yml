name: DevIsland
options:
  bundleIdPrefix: kr.or.nes
  xcodeVersion: "15.0"
  objectVersion: 56
settings:
  SWIFT_VERSION: "5.9"
packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: "0.3.1"
targets:
  DevIsland:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: DevIsland
      - path: scripts/devisland-bridge.sh
        group: Resources
        type: resource
      - path: scripts/devisland_bridge.py
        group: Resources
        type: resource
      - path: scripts/install-bridge.sh
        group: Resources
        type: resource
      - path: scripts/install-launch-agent.sh
        group: Resources
        type: resource
    info:
      path: DevIsland/Info.plist
      properties:
        CFBundleShortVersionString: "0.10.2"
        CFBundleVersion: "83"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: "Approve/Deny 후 터미널 앱을 포커스하기 위해 사용합니다."
        NSAccessibilityUsageDescription: "글로벌 단축키(⌘⇧Y/N) 사용을 위해 접근성 권한이 필요합니다."
    dependencies:
      - package: Textual
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: "$(TARGET_NAME)"
      OTHER_LDFLAGS:
        - "$(inherited)"
        - "-lsqlite3"
  DevIslandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: DevIslandTests
    dependencies:
      - target: DevIsland
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  DevIsland:
    build:
      targets:
        DevIsland: all
    test:
      targets:
        - name: DevIslandTests
      environmentVariables:
        XCODE_RUNNING_UNIT_TESTS: "1"
