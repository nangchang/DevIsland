name: 기능 제안
description: 해결할 문제와 검증 가능한 결과를 중심으로 기능을 제안합니다.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        구현 방법보다 먼저 해결할 문제와 원하는 결과를 설명해 주세요.
        범위와 완료 조건을 명시하면 사람과 AI 에이전트가 같은 목표를 공유하기 쉬워집니다.

  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 현재 누가 어떤 상황에서 무엇 때문에 어려움을 겪는지 설명해 주세요.
      placeholder: "현재는 … 때문에 … 할 수 없습니다."
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 원하는 결과
      description: 기능이 추가된 뒤 사용자가 할 수 있어야 하는 일을 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 사용자 흐름과 예상 동작을 설명해 주세요. 구체적인 구현은 선택 사항입니다.
      placeholder: |
        1. 사용자가 … 합니다.
        2. DevIsland가 … 표시합니다.
        3. 사용자가 … 확인할 수 있습니다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 구현 완료 여부를 테스트할 수 있는 조건을 목록으로 적어 주세요.
      placeholder: |
        - [ ] … 상황에서 … 동작합니다.
        - [ ] 기존 Claude/Codex/Gemini 흐름은 그대로 동작합니다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 반드시 포함할 것과 이번 제안에서 제외할 것을 구분해 주세요.
      placeholder: |
        포함:
        -

        제외:
        -
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 현재 우회 방법이나 고려했지만 선택하지 않은 접근이 있다면 이유와 함께 적어 주세요.
      placeholder: 없다면 "없음"이라고 적어 주세요.

  - type: textarea
    id: context
    attributes:
      label: 추가 맥락과 제약
      description: 관련 이슈, 화면, provider 차이, 성능·호환성 제약 또는 참고 자료를 적어 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 이슈에서 같은 제안을 검색했습니다.
          required: true
        - label: 문제, 범위 및 완료 조건을 서로 구분해 작성했습니다.
          required: true

  - type: textarea
    id: ai_attribution
    attributes:
      label: AI attribution
      description: AI 도구를 사용해 작성했다면 attribution footer를 입력해 주세요. 사용하지 않았다면 비워 두세요.
      placeholder: "> 🤖 Generated with [Tool](URL)"
