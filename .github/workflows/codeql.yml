name: CodeQL
on:
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - 'project.yml'
  schedule:
    - cron: '0 9 * * 1'

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-15

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/codeql.yml') }}
          restore-keys: ${{ runner.os }}-brew-

      - name: Cache XcodeGen
        id: cache-xcodegen
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/bin/xcodegen
            /opt/homebrew/Cellar/xcodegen
          key: ${{ runner.os }}-xcodegen-${{ hashFiles('.github/workflows/codeql.yml') }}

      - name: Install XcodeGen
        if: steps.cache-xcodegen.outputs.cache-hit != 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      - name: Build for CodeQL
        run: |
          HOST_ARCH="$(uname -m)"
          xcodebuild clean build \
            -project DevIsland.xcodeproj \
            -scheme DevIsland \
            -destination "platform=macOS,arch=${HOST_ARCH}" \
            -derivedDataPath /tmp/DevIsland-CodeQL-DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
